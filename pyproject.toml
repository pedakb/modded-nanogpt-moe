[project]
name = "modded-nanogpt-moe"
version = "0.1.0"
description = "Reproducible environment for modded-nanoGPT MoE research (dense vs. top-k MoE vs. custom router baselines)"
requires-python = "==3.11.*"
dependencies = [
    "numpy",
    "tqdm",
    "torch==2.11",
    "huggingface-hub",
    "kernels",
    "setuptools",
    "typing-extensions==4.15.0",
    "datasets",
    "tiktoken",
]

[dependency-groups]
dev = ["pytest"]

[project.optional-dependencies]
cu128 = ["torch==2.11"]
cu129 = ["torch==2.11"]

[tool.uv]
package = false
conflicts = [
    [
        { extra = "cu128" },
        { extra = "cu129" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "pytorch-cu129", extra = "cu129", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true
